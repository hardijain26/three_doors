name: Three Doors Search Scheduler

on:
  schedule:
    # Run every 15 minutes, offset from the top of the hour to reduce queueing.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  dispatch-searches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: three-doors-search-scheduler
      cancel-in-progress: false
    steps:
      - name: Dispatch due searches
        env:
          THREE_DOORS_URL: ${{ vars.THREE_DOORS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${THREE_DOORS_URL:-}" ]; then
            echo "Missing GitHub Actions variable: THREE_DOORS_URL"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${THREE_DOORS_URL%/}/api/cron/search"
